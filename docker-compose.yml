# =============================================================================
# loginrek — DEVELOPMENT LOKAL
#
#   docker compose up -d --build            # semuanya: PostgreSQL + RustFS + backend + dashboard
#   docker compose up -d postgres rustfs    # hanya infra (backend/dashboard lewat go run / npm run dev)
#
#   Backend   : http://localhost:3333   (juga http://<IP-PC>:3333 untuk HP di Wi-Fi yang sama)
#   Dashboard : http://localhost:5173
#
# Nilai dibaca dari .env di root (lihat .env.example). Aplikasi mobile tidak ada di sini:
# jalankan dengan `npm run dev` (Expo Go) atau bangun APK dengan EAS (lihat README).
# Production: lihat docker-compose.prod.yml.
# =============================================================================

name: loginrek-dev

services:
  # RustFS berjalan sebagai uid 10001; volume baru dimiliki root, jadi hak akses disetel dulu.
  rustfs-perms:
    image: alpine:3.22
    user: root
    command: [ "sh", "-c", "chown -R 10001:10001 /data" ]
    volumes:
      - rustfs_data:/data
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: loginrek-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-loginrek_db}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: loginrek-dev-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-perms: { condition: service_completed_successfully }
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${RUSTFS_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data

  backend:
    build: ./loginrek-backend
    container_name: loginrek-dev-backend
    restart: unless-stopped
    environment:
      PORT: 3333
      APP_ENV: development                 # development: akun karyawan uji ikut di-seed
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-loginrek_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-}          # wajib >= 32 karakter; kosong/CHANGE_ME = backend berhenti
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-loginrek-media}
      RUSTFS_USE_SSL: "false"
      RUSTFS_PUBLIC_URL: ""                # foto disajikan backend lewat /uploads/*
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_EMPLOYEE_EMAIL: ${SEED_EMPLOYEE_EMAIL:-}
      SEED_EMPLOYEE_PASSWORD: ${SEED_EMPLOYEE_PASSWORD:-}
      IMAGE_MAX_WIDTH: ${IMAGE_MAX_WIDTH:-1280}
      IMAGE_MAX_HEIGHT: ${IMAGE_MAX_HEIGHT:-720}
      IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-80}
    ports:
      - "3333:3333"                        # semua interface: HP di Wi-Fi yang sama bisa mengakses
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_started }

  dashboard:
    build:
      context: ./loginrek-dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}   # dibakar ke bundle saat build
    container_name: loginrek-dev-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  uploads_data:
    name: loginrek_dev_uploads_data
  pg_data:
    name: loginrek_dev_pg_data
  rustfs_data:
    name: loginrek_dev_rustfs_data
