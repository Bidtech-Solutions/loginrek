# =============================================================================
# CI/CD loginrek — backend (Go) + dashboard (React/Vite) ke VPS
#
#   check   : go vet/build backend, lint + build dashboard
#   build   : build image Docker backend & dashboard -> push ke GHCR
#             (tag sha-xxxxxxx + latest)
#   package : bungkus docker-compose.prod.yml + .env.example sebagai artifact
#   deploy  : buat .env production dari .env.example (nilai production diisi dari
#             env/secrets di bawah), kirim ke VPS (SCP) -> pull image -> up
#
# VPS memakai Traefik (jaringan eksternal traefik-network); lihat docker-compose.prod.yml.
# Secrets (environment `production`) yang dibutuhkan:
#   VPS_HOST, VPS_SSH_KEY,
#   JWT_SECRET (min. 32 karakter), DB_PASSWORD, RUSTFS_SECRET_KEY
# Akun awal (SEED_ADMIN_*, SEED_EMPLOYEE_*) dan RUSTFS_ACCESS_KEY diambil apa adanya dari .env.example.
# (opsional: VPS_USER default "root", VPS_PORT default 22, VPS_DEPLOY_PATH default /opt/loginrek).
# Nilai non-rahasia production (domain dll.) ada di blok `env` job deploy. Setiap deploy
# MENIMPA .env di VPS dari .env.example + nilai-nilai tersebut; ubah konfigurasi di sini,
# bukan lewat edit .env di VPS. Variabel baru: tambahkan ke .env.example, lalu override di
# langkah "Buat .env production" bila nilainya berbeda di production.
# Login GHCR di VPS otomatis memakai github.actor + GITHUB_TOKEN (berlaku selama job deploy),
# jadi tidak perlu PAT. Skema database dimigrasi otomatis
# (GORM AutoMigrate) saat backend start. Aplikasi mobile (loginrek-mobile)
# tidak dideploy dari workflow ini.
# =============================================================================

name: loginrek

on:
  push:
    branches: [main]
    paths:
      - "loginrek-backend/**"
      - "loginrek-dashboard/**"
      - "docker-compose.prod.yml"
      - ".env.example"
      - ".github/workflows/loginrek.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Domain publik production (DNS mengarah ke VPS). API_DOMAIN dibakar ke bundle
  # dashboard saat build sebagai VITE_API_URL.
  DASHBOARD_DOMAIN: loginrek.bidtech.co.id
  API_DOMAIN: loginrek-api.bidtech.co.id

jobs:
  check-backend:
    name: Backend — vet & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loginrek-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: loginrek-backend/go.mod
          cache-dependency-path: loginrek-backend/go.sum
      - run: go vet ./...
      - run: go build ./...

  check-dashboard:
    name: Dashboard — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loginrek-dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: loginrek-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  build:
    name: Build & push image (${{ matrix.app }})
    needs: [check-backend, check-dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [backend, dashboard]
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Siapkan nama image
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/loginrek-${{ matrix.app }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: loginrek-${{ matrix.app }}
          push: true
          build-args: ${{ matrix.app == 'dashboard' && format('VITE_API_URL=https://{0}', env.API_DOMAIN) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  package:
    name: Artifact compose + env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-artifact@v7
        with:
          name: deploy-bundle
          path: |
            docker-compose.prod.yml
            .env.example
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy ke VPS
    needs: [build, package]
    runs-on: ubuntu-latest
    environment: production
    # packages: read -> GITHUB_TOKEN dipakai VPS untuk `docker pull` dari GHCR selama job ini berjalan
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/loginrek' }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      GHCR_OWNER: ${{ needs.build.outputs.owner }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Rahasia production -> masuk ke .env di VPS
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deploy-bundle
          path: bundle

      - name: Buat .env production dari .env.example
        run: |
          set -euo pipefail

          missing=0
          for k in JWT_SECRET DB_PASSWORD RUSTFS_SECRET_KEY; do
            if [ -z "${!k}" ]; then echo "::error::Secret $k belum diisi (Settings > Environments > production)"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          if [ "${#JWT_SECRET}" -lt 32 ]; then echo "::error::JWT_SECRET minimal 32 karakter"; exit 1; fi

          cd bundle
          cp .env.example .env

          # Ganti nilai KEY di .env (atau tambahkan bila belum ada). Nilai lewat ENVIRON
          # agar karakter khusus (| & \ $) tidak ditafsirkan.
          set_env() {
            K="$1" V="$2" awk '
              BEGIN { k = ENVIRON["K"]; v = ENVIRON["V"] }
              index($0, k "=") == 1 { print k "=" v; done = 1; next }
              { print }
              END { if (!done) print k "=" v }
            ' .env > .env.tmp && mv .env.tmp .env
          }

          # -- umum & backend --
          set_env APP_ENV production
          set_env CORS_ORIGINS "https://$DASHBOARD_DOMAIN"
          set_env JWT_SECRET "$JWT_SECRET"
          # -- akun awal (SEED_*): tidak di-override, ikut nilai di .env.example --
          # -- database & object storage (jaringan internal compose) --
          set_env DB_USER loginrek
          set_env DB_PASSWORD "$DB_PASSWORD"
          set_env DB_NAME loginrek_db
          set_env RUSTFS_ENDPOINT lr-rustfs:9000
          set_env RUSTFS_SECRET_KEY "$RUSTFS_SECRET_KEY"
          set_env RUSTFS_PUBLIC_URL ""
          # -- domain & dashboard --
          set_env DASHBOARD_DOMAIN "$DASHBOARD_DOMAIN"
          set_env API_DOMAIN "$API_DOMAIN"
          set_env VITE_API_URL "https://$API_DOMAIN"
          # -- deploy --
          set_env GHCR_OWNER "$GHCR_OWNER"
          set_env IMAGE_TAG "$IMAGE_TAG"

          # Pengaman: tidak boleh ada placeholder yang lolos ke production
          if grep -qE '^[A-Z0-9_]+=(CHANGE_ME|change-me)$' .env; then
            echo "Variabel yang masih placeholder:"
            grep -E '^[A-Z0-9_]+=(CHANGE_ME|change-me)$' .env | sed -E 's/=.*//'
            echo "::error::.env production masih berisi placeholder; tambahkan override di langkah ini."
            exit 1
          fi
          echo "Variabel di .env production: $(grep -cE '^[A-Z0-9_]+=' .env)"

      - name: Siapkan folder di VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH
          script: mkdir -p "$DEPLOY_PATH"

      - name: Kirim docker-compose.prod.yml & .env
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bundle/docker-compose.prod.yml,bundle/.env"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull image & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE_TAG,GHCR_OWNER,GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            export COMPOSE_FILE=docker-compose.prod.yml

            # .env dibuat workflow dari .env.example (langkah "Buat .env production")
            chmod 600 .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            docker compose pull
            docker compose up -d --wait --remove-orphans

            docker compose ps
            docker image prune -f || true
            echo "Deployed ghcr.io/$GHCR_OWNER/loginrek-{backend,dashboard}:$IMAGE_TAG"
